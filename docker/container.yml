# 容器冒烟用的覆盖层：`dsh web --profile qa --patch /plugin/docker/container.yml`
#
# 按 id 命中那一行是插件自己装进来的（`dsh plugin add` 会把它的 cordis.patch.yml 纳入 profile），
# 这一层只改它的 config。**config 是整块替换、不做深合并** —— 所以要用到的字段全写在这儿。
- id: dsh-world
  name: dsh-world
  config:
    qqNative:
      enabled: true
      # 容器里的假 OneBot，由 docker/smoke.mjs 起
      wsUrl: ws://127.0.0.1:39003
      allowPrivate: ['3475994805']
      allowGroups: ['681528777']
      autoReply: true